name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate skills/*/SKILL.md
        run: python3 scripts/validate-skills.py .

      # The hooks ship as executable files, so a syntax error or a lost
      # exec bit is a broken install rather than a broken document. Both
      # are cheap to catch here and invisible in review.
      - name: Check the guard hooks
        run: |
          set -euo pipefail
          status=0
          for hook in skills/agent-kit/hooks/*.sh; do
            if bash -n "$hook"; then
              echo "ok: $hook parses"
            else
              echo "::error file=$hook::does not parse under bash -n"
              status=1
            fi
            if [ ! -x "$hook" ]; then
              echo "::error file=$hook::is not executable (git mode should be 100755)"
              status=1
            fi
          done
          exit "$status"

  # The kit's central claim is that its guards refuse what they must. This
  # job is where that claim is checked: every behaviour test runs the real
  # hook as a subprocess, fed a PreToolUse payload, and asserts on the exit
  # status and the refusal text. The "configured" tests run each policy of
  # tests/hooks/fixtures/settings.json -- the wiring the skills document,
  # filled in for an example layout -- so a glob change in the docs that
  # opens a hole fails here, not in someone's project.
  hooks:
    name: hook behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install --quiet pytest

      - name: Guards refuse what they must
        run: python -m pytest tests/hooks -q -p no:cacheprovider
